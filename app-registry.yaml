            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-r-notebook:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
