                port: 8787
              delay: 5
              period: 5
      rstudio-server-w-nginx:
        ext:
          kube:
            readinessProbe:
              httpGet:
                path: /
                port: 8787
              delay: 5
              period: 5
      scout:
        ext:
          kube:
            readinessProbe: none
      slicer:
        ext:
          kube:
            readinessProbe: none
      webtop:
        ext:
