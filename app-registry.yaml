        ext:
          kube:
            readinessProbe: none
      nvidia-tensorflow:
        ext:
          kube:
            readinessProbe:
              httpGet:
                path: "/private/{{ system_name }}/{{ username }}/{{ identifier }}/"
                port: "7681"
      octave:
