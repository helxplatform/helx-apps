            readinessProbe: none
      webtop-image-apps:
        ext:
          kube:
            readinessProbe: none
      webtop-octave:
        ext:
          kube:
            readinessProbe: none
      webtop-pgadmin:
        ext:
          kube:
            readinessProbe: none
      nvidia-tensorflow-root:
        securityContext:
          runAsUser: 0
          runAsGroup: ""
          fsGroup: ""
