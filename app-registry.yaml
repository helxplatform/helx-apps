################################################################################
##
## HeLx Application Registry
##  
##   The registry consolidates metadata links to application specifications.
##   The registry's main components are:
##     * Metadata about the registry itself
##     * Repositories describing sources of application metadata.
##     * Sub-Registries providing contexts for sets of applications.
##
##   Each application has an identifier, name, description, and a link to its 
##   specification. Applications may currently be specified in the 
##   docker-compose format though we also expect to broaden the scope of 
##   apps to include launching websites and other methods.
##
##   When a platform launches an application, it needs to know what endpoints
##   to present upstream. Apps can also specify a map of service names to port
##   numbers. The service and port name must match the name of a container
##   in the docker-compose specification and its exposed port respectively.
##
##   Contexts implement a simple form of inheritance. Each context may speicify
##   a list of contexts it extends. Apps from extended contexts will be added
##   to the extending context's apps.
##
##   This is alpha. Expect significant changes to modularity, inheritance,
##   and naming coming soon.
##
##   Next steps:
##     * Requirements: allow apps to specify that they require services including
##        - A back end service like a database, spark, dicom api, etc.
##        - A storage device like a pvc with a particular name or configuration.
##     * Compilation: Compile the registry verifying
##        - All required elements are either provided explicitly or can be
##          inferred.
##        - That designated network resources exist (200 http status).
##        - That the docker-compose file is syntactically valid.
##        - That the service name to export is in the docker-compose file and
##          that one is specified.
##     * Semantic annotation: Annotate apps with the Biolink model and EDAM
##        ontology to enable semantic search.
##
################################################################################
api: Tycho
version: 0.0.1
metadata:
  id: helx-app-registry
  name: HeLx Application Registry
  author: HeLx Dev
  description: An alpha metadata registry for HeLx applications.
repositories:
  helx_apps:
    # This is the Dockstore app prototype repository. GA4GH TRS in future?
    description: Main repository for HeLx Apps and Tools
    # URL is in the form of raw access of files from GitHub.
    # url: https://github.com/[corporation]/[project]/[branch]/[app specs directory]
    # url: https://github.com/helxplatform/helx-apps/raw/external-app-registry/app-specs
    # To use the same git repo as this file is in just specify the directory.
    # url: app-specs
    url: app-specs
settings:
  helx_registry: containers.renci.org
  third_party_registry: docker.io
  helx_user: "{{ username }}"
contexts:
  # The common context provides a convenient base set of applications.
  # Other contexts can extend it to include these apps.
  sys:
    apps:
      atlas:
        ext:
          kube:
            readinessProbe: none
      cloud-top:
        ext:
          kube:
            readinessProbe: none
      imagej:
        ext:
          kube:
            readinessProbe: none
      jupyter-datascience-db:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-ds:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-education:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-helx-db-notebook:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-helx-notebook:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-helx-pytorch-nb:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-helx-tensorflow-nb:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-lab:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-nvidia-tf-nb:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      jupyter-r-notebook:
        ext:
          kube:
            livenessProbe:
              cmd: ["pgrep", "jupyter" ]
              delay: 5
              period: 5
      napari:
        ext:
          kube:
            readinessProbe: none
      nvidia-tensorflow:
        ext:
          kube:
            readinessProbe:
              httpGet:
                path: "/private/{{ system_name }}/{{ username }}/{{ identifier }}/"
                port: "7681"
      octave:
        ext:
          kube:
            readinessProbe: none
      pgadmin:
        ext:
          kube:
            readinessProbe: none
      rstudio-rocker:
        ext:
          kube:
            readinessProbe: none
      rstudio-server:
        ext:
          kube:
            readinessProbe:
              httpGet:
                path: /
                port: 8787
              delay: 5
              period: 5
      rstudio-server-w-nginx:
        ext:
          kube:
            readinessProbe:
              httpGet:
                path: /
                port: 8787
              delay: 5
              period: 5
      scout:
        ext:
          kube:
            readinessProbe: none
      slicer:
        ext:
          kube:
            readinessProbe: none
      webtop:
        ext:
          kube:
            readinessProbe: none
      webtop-image-apps:
        ext:
          kube:
            readinessProbe: none
      webtop-octave:
        ext:
          kube:
            readinessProbe: none
      webtop-pgadmin:
        ext:
          kube:
            readinessProbe: none
      nvidia-tensorflow-root:
        securityContext:
          runAsUser: 0
          runAsGroup: ""
          fsGroup: ""
  helx:
    name: HeLx App Registry
    mixin:
      - sys
    apps:
      jupyter-helx-notebook:
        name: Jupyter HeLx Notebook
        description: Based on the Jupyter SciPy Notebook.
        details: Includes popular packages from the scientific Python ecosystem.
        docs: https://jupyter-docker-stacks.readthedocs.io/en/latest/using/selecting.html#jupyter-scipy-notebook
        services:
          jupyter-helx-notebook: "8888"
        proxy-rewrite-rule: True
        count: 1
      jupyter-helx-tensorflow-nb:
        name: Jupyter HeLx Tensorflow Notebook
        description: Based on the Jupyter SciPy Notebook.
        details: Includes popular packages from the scientific Python ecosystem.  In addition to the Python packages normally installed in the SciPy image, tensorflow, keras, pytorch, nibabel and mlxtend are also installed.
        docs: https://jupyter-docker-stacks.readthedocs.io/en/latest/using/selecting.html#jupyter-scipy-notebook
        services:
          jupyter-helx-tensorflow-nb: "8888"
        proxy-rewrite-rule: True
        count: 1
      jupyter-lab:
        name: Jupyter Lab
        description: Jupyter Lab - A Jupyter Lab instance for exploring and visualizing data.
        details: Includes Python.
        docs: https://jupyter-docker-stacks.readthedocs.io/en/latest/using/selecting.html#jupyter-datascience-notebook
        services:
          jupyter-lab: "8888"
        proxy-rewrite-rule: True
        gitea-integration: False
        count: 1
      jupyter-nvidia-tf-nb:
        name: Jupyter NVIDIA Tensorflow Notebook
        description: NVIDIA's Tensorflow image.
        details: Tensorflow image built by NVIDIA with CUDA support.
        docs: https://catalog.ngc.nvidia.com/orgs/nvidia/containers/tensorflow
        services:
          jupyter-nvidia-tf-nb: "8888"
        proxy-rewrite-rule: True
        count: 1
      jupyter-r-notebook:
        name: Jupyter R Notebook
        description: Jupyter R Notebook - A Jupyter notebook with popular R packages.
        details: Includes Notebook, Jupyter Lab, R interpreter, and misc packages from conda-forge.
        docs: https://jupyter-docker-stacks.readthedocs.io/en/latest/using/selecting.html#jupyter-r-notebook
        services:
          jupyter-r-notebook: "8888"
        proxy-rewrite-rule: True
        count: 1
      nvidia-tensorflow:
        name: NVIDIA Tensorflow
        description: Includes support for using Tensorflow with CUDA.  Opens a tmux (terminal multiplexer) in a web terminal interface.
        details: The TensorFlow NGC Container is optimized for GPU acceleration, and contains a validated set of libraries that enable and optimize GPU performance.
        docs: https://catalog.ngc.nvidia.com/orgs/nvidia/containers/tensorflow
        services:
          nvidia-tensorflow: "8888"
        proxy-rewrite-rule: True
        count: 1
      rstudio-rocker:
        name: RStudio Server from rocker
        description: An integrated development environment for R.
        details: Has a console, syntax-highlighting editor that supports direct code execution, and tools for plotting, history, debugging and workspace management.
        docs: https://www.rstudio.com/
        services:
          rstudio-rocker: "8080"
        count: 1
        proxy-rewrite-rule: True
      rstudio-server:
        name: RStudio Server
        description: An integrated development environment for R.
        details: Has a console, syntax-highlighting editor that supports direct code execution, and tools for plotting, history, debugging and workspace management.
        docs: https://www.rstudio.com/
        services:
          rstudio-server: "8787"
        count: 1
        # proxy-rewrite-rule: True
        proxy-rewrite:
          enabled: true
          target: /
