version: "3"
services:
  biome:
    image: "docker.io/frostyfan109/bdf-pz:10-31-25.1"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16384M
        reservations:
          cpus: "1"
          memory: 4096M
