---
# Docker compose formatted system.
version: "3"
services:
  rstudio-server:
    image: "{{ helx_registry }}/helxplatform/rstudio-server:v0.3.0"
    ports:
      - 8787:8787
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
        reservations:
          cpus: ".5"
          memory: 1024M
