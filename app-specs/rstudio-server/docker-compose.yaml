---
# Docker compose formatted system.
version: "3"
services:
  rstudio-server:
    image: "containers.renci.org/eds/eds-rstudio:latest"
    ports:
      - 8877:8877
    volumes:
        - pvc://projects-pvc:/projects
    deploy:
        resources:
          limits:
            cpus: '2'
            memory: 32000M
          reservations:
            cpus: '.5'
            memory: 1024M
