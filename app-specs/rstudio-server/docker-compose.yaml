---
# Docker compose formatted system.
version: "3"
services:
  rstudio-server:
    image: "containers.renci.org/eds/eds-rstudio:v0.0.1"
    # env:
    #   - DELETE_DEFAULT_USER_HOME_IF_UNUSED=no
    #   - RSTUDIO_LOG_LEVEL=debug
    ports:
      - 8787:8787
    volumes:
      - pvc://projects-ees-pvc:/projects/ees
    deploy:
        resources:
          limits:
            cpus: '2'
            memory: 128000M
          reservations:
            cpus: '1'
            memory: 64000M
