---
# Docker compose formatted system.
version: "3"
services:
  rstudio-server:
    image: "containers.renci.org/helxplatform/rstudio-server:test_13"
    ports:
      - 8787:8787
    volumes:
        - pvc://projects-pvc:/projects
    deploy:
        resources:
          limits:
            cpus: '8'
            memory: 12000M
            devices:
            - capabilities: ["gpu"]
              count: "1"
          reservations:
            cpus: '1'
            memory: 2000M
            devices:
            - capabilities: ["gpu"]
              count: "0"
