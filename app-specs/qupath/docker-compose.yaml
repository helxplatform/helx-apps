version: "3.0"
services:
  qupath:
    image: "{{ helx_registry }}/helxplatform/qupath:v0.0.0"
    container_name: qupath
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16000M
        reservations:
          cpus: "1"
          memory: 4000M
