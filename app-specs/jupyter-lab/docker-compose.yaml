version: "0.0.1"
services:
  jupyter-lab:
    image: "containers.renci.org/helxplatform/jupyter/helx-tensorflow-notebook:v0.2.1"
    container_name: jupyter-lab
    entrypoint:
      - /bin/bash
      - -c
      - start-jupyter-lab.sh
    ports:
      - 8888:8888
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 64000M
          devices:
            - capabilities: [ "gpu" ]
              count: "1"
        reservations:
          cpus: '1'
          memory: 1000M
          devices:
            - capabilities: ["gpu"]
              count: "0"