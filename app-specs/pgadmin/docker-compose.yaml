version: '3.6'
services:
  pgadmin:
    image: "{{ helx_registry }}/helxplatform/pgadmin4-ldap:master-820c85547"
    container_name: pgadmin
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4096M
        reservations:
          cpus: '1'
          memory: 2048M
