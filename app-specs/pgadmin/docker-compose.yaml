version: '3.6'
services:
  pgadmin:
    image: "containers.renci.org/helxplatform/pgadmin4:v9.1.26"  # temporarily using version tag to fix caching issue.
    pull_policy: always
    container_name: pgadmin
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 12000M
        reservations:
          cpus: '1'
          memory: 2000M
