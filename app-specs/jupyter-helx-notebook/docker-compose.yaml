version: "3"
services:
  jupyter-helx-notebook:
    image: "containers.renci.org/helxplatform/jupyter/helx-tensorflow-notebook:v0.2.2"
    ports:
      - 8888:8888
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8000M
          ephemeralStorage: 8000Mi
        reservations:
          cpus: '.5'
          memory: 2560M
          ephemeralStorage: 256Mi
