version: "3"
services:
  jupyter-helx-notebook:
    image: "{{ azure_registry }}/helxplatform/jupyter/ordr-d:ordrd-test-azure"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 8192M
        reservations:
          cpus: "1"
          memory: 8192M
