version: "3"
services:
  jupyter-helx-notebook:
    image: "{{ helx_registry }}/helxplatform/jupyter/helx-notebook:v0.1.5"
    # start.sh drops root -> notebook user (avoids "running as root" exit) and
    # serves under the injected NB_PREFIX so the preserved /private path works.
    entrypoint:
      - start.sh jupyter lab --LabApp.token= --ip="*" --NotebookApp.base_url=${NB_PREFIX} --NotebookApp.allow_origin="*"
    ports:
      - 8888:8888
    volumes:
        - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8000M
        reservations:
          cpus: '2'
          memory: 2000M

