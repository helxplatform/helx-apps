version: "3"
services:
  jupyter-helx-notebook:
    image: "{{ helx_registry }}/helxplatform/jupyter-helx-notebook:uncdsr-155-pilot"
    ports:
      - 8888:8888
    volumes:
        - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8000M
        reservations:
          cpus: '2'
          memory: 2000M

