version: "3"
services:
  jupyter-ai-notebook:
    image: "{{ helx_registry }}/helxplatform/jupyter/helx-notebook/ai-sandbox-notebook:v0.1.2"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16384M
          ephemeralStorage: 2048Mi
        reservations:
          cpus: "1.5"
          memory: 8192M
          ephemeralStorage: 812Mi
