version: "3"
services:
  jupyter-ai-notebook:
    # image: "{{ helx_registry }}/helxplatform/jupyter/helx-tensorflow-notebook:v0.2.2"
    image: "{{ azure_registry }}/helxplatform/jupyter/helx-notebook/ai-sandbox-notebook:v0.0.3-public-good"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16384M
          ephemeralStorage: 8192Mi
        reservations:
          cpus: "2"
          memory: 8192M
          ephemeralStorage: 8192Mi
