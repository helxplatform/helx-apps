version: "3"
services:
  filebrowser:
    # UNCDSR-182: helx-1.1.1 predates the read-only-rootfs fix (settings.json
    # relocated under $HOME/.filebrowser instead of the image root -- see
    # docker/debian/init.sh and setup-trash.sh). This is the tag actually
    # built+pushed with that fix; confirmed /init.sh (invoked below) has it.
    image: "{{ helx_registry }}/helxplatform/filebrowser:vUNCDSR-182-readonly-rfs"
    ports:
      - 8080:8080
    entrypoint:
      - /bin/sh
      - -c
      - >
        ROOT_DIR=$(test -d /shared && echo "/home/${USER}" || echo "/home");
        exec tini -- /init.sh /filebrowser --noauth --root="${ROOT_DIR}" --address=0.0.0.0 --port=8080 --database=/home/${USER}/.filebrowser/filebrowser.db;
    volumes:
        - pvc://projects-pvc:/projects
        # UNCDSR-182: the only writable paths filebrowser needs (database and
        # settings.json, per init.sh/setup-trash.sh) are already relocated
        # under $HOME, which Tycho already backs with a writable PVC
        # regardless of readOnlyRootFilesystem -- no new volume needed for
        # those. /tmp is a plain safety net (Go's os.TempDir(), used by
        # upload/extract paths).
        - emptyDir://filebrowser-tmp:/tmp
    deploy:
        resources:
          limits:
            cpus: '2'
            memory: 2000M
          reservations:
            cpus: '.5'
            memory: 1000M
# UNCDSR-182: top-level, not per-service -- see jupyter-helx-notebook's
# app-spec comment for why.
security_context:
  readOnlyRootFilesystem: true
