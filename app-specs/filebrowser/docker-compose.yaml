version: "3"
services:
  filebrowser:
    image: "{{ helx_registry }}/helxplatform/filebrowser:v3.6.0"
    ports:
      - 8080:8080
    entrypoint:
      - /bin/sh
      - -c
      - >
        ROOT_DIR=$(test -d /shared && echo "/home/${USER}" || echo "/home");
        exec tini -- /init.sh /filebrowser --noauth --root="${ROOT_DIR}" --address=0.0.0.0 --port=8080 --database=/home/${USER}/.filebrowser/filebrowser.db;
    volumes:
        - pvc://projects-pvc:/projects
        # UNCDSR-182: the writable paths filebrowser needs (filebrowser.db and
        # settings.json, already exist under $HOME, which Tycho backs with a
        # writable PVC, so they don't need a new volume.
        # Adding /tmp as a safety net (Go's os.TempDir(), used by
        # upload/extract paths):
        - emptyDir://filebrowser-tmp:/tmp
    deploy:
        resources:
          limits:
            cpus: '2'
            memory: 2000M
          reservations:
            cpus: '.5'
            memory: 1000M
# UNCDSR-182: Make filesytem read-only:
security_context:
  readOnlyRootFilesystem: true
