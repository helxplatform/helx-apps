version: "3"
services:
  jupyter-helx-notebook-renci:
    image: "containers.renci.org/helxplatform/jupyter/helx-tensorflow-notebook:v0.2.2"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-ees-pvc:/projects/ees
      - pvc://projects-prediction-work-pvc:/projects/prediction_work
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 190000M
          ephemeralStorage: 1024Mi
        reservations:
          cpus: '.5'
          memory: 8000M
          ephemeralStorage: 256Mi
