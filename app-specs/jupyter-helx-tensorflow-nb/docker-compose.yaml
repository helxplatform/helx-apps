version: "3"
services:
  jupyter-helx-tensorflow-nb:
    # image: "{{ helx_registry }}/helxplatform/jupyter/helx-tensorflow-notebook:v0.2.2"
    image: "{{ helx_registry }}/helxplatform/jupyter/helx-notebook/ai-sandbox-notebook:v0.0.2"
    ports:
      - 8888:8888
    volumes:
      - pvc://projects-pvc:/projects
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 16384M
          ephemeralStorage: 12288Mi
          devices:
            - capabilities: ["gpu"]
              count: "1"
        reservations:
          cpus: "1"
          memory: 4096M
          ephemeralStorage: 4096Mi
          devices:
            - capabilities: ["gpu"]
              count: "0"
