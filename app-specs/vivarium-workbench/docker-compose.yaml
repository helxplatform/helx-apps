version: "3"
services:
  vivarium-workbench:
    image: "aisandboxrencitgt.azurecr.io/vivarium-workbench:latest"
    ports:
      - 8000:8000
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4000M
          ephemeralStorage: 8192Mi
        reservations:
          cpus: ".5"
          memory: 250M
          ephemeralStorage: 1024Mi
