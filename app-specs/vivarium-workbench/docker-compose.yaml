version: "3"
services:
  vivarium-workbench:
    image: "aisandboxrencitgt.azurecr.io/vivarium-workbench:latest"
    ports:
      - 8000:8000
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8000M
          ephemeralStorage: 8192Mi
        reservations:
          cpus: "1"
          memory: 4000M
          ephemeralStorage: 8192Mi
